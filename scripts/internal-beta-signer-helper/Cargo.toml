[package]
name = "vc-internal-beta-signer-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "3.0.0", features = ["pem", "pkcs8"] }
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.23.0"
