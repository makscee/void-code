<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="index.css"><title>Void Code</title></head>
<body>
<header><strong>Void Code</strong><span id="folder" data-l10n="No folder selected"></span><button id="about-toggle" type="button" aria-controls="about-panel" aria-expanded="false" data-l10n="About"></button><button id="support-toggle" type="button" aria-controls="support-panel" aria-expanded="false" data-l10n="Support"></button><button id="recent-toggle" type="button" aria-controls="recent" aria-expanded="false" data-l10n="Recent Chats" hidden></button><button id="new-chat" data-l10n="New Chat" hidden></button><button id="choose" data-l10n="Choose Folder"></button></header>
<div id="notice" role="status" hidden></div>
<section id="about-panel" aria-labelledby="about-heading" hidden><h2 id="about-heading" data-l10n="About Void Code"></h2><p id="update-current"></p><p id="update-status" role="status"></p><label for="locale-select" data-l10n="Language"></label><select id="locale-select"><option value="ru" data-l10n="Russian"></option><option value="en" data-l10n="English"></option></select><div><button id="update-check" type="button" data-l10n="Check for updates"></button><button id="update-download" type="button" hidden></button><button id="about-close" type="button" data-l10n="Close"></button></div></section>
<section id="support-panel" aria-labelledby="support-heading" hidden><h2 id="support-heading" data-l10n="Support Report"></h2><p data-l10n="Includes only app/version, coarse system and recovery state. It excludes sign-in data, paths, file or chat content, terminal output and environment variables."></p><div><button id="support-copy" type="button" data-l10n="Copy Report"></button><button id="support-save" type="button" data-l10n="Save Report"></button><button id="support-close" type="button" data-l10n="Close"></button></div></section>
<nav id="tabs" data-l10n-aria="Open chats" aria-label="" hidden></nav>
<main>
  <section id="sign-in" hidden><h1 data-l10n="Sign in to Void Code"></h1><p data-l10n="Use your browser to authorize this app. No terminal or separate VC installation is required."></p><button id="sign-in-start" type="button" data-l10n="Sign In"></button><div id="sign-in-waiting" hidden><p data-l10n="Enter this code in the browser:"></p><strong id="sign-in-code"></strong><p data-l10n="Waiting for authorization…"></p></div><p id="sign-in-error" role="alert" data-l10n="Sign in did not complete. Check your connection and try again." hidden></p></section>
  <section id="empty"><h1 data-l10n="Choose one trusted folder"></h1><p data-l10n="Each chat in this window works directly in that folder using your existing VC authentication."></p><button id="empty-choose" data-l10n="Choose Folder"></button></section>
  <section id="preflight" hidden><h2 data-l10n="Ready for your first chat"></h2><p data-l10n="Your Void Code sign-in is ready. Choose New Chat to begin."></p></section>
  <section id="recovery" hidden><h2 data-l10n="Workspace unavailable"></h2><p id="recovery-path"></p><p data-l10n="Locate the moved folder or remove this saved workspace. No fallback working directory will be used."></p><button id="locate" data-l10n="Locate Folder"></button><button id="remove-workspace" data-l10n="Remove"></button></section>
  <div id="terminals"></div>
  <section id="ended" hidden><h2 id="ended-heading"></h2><p id="ended-detail"></p><button id="restart" data-l10n="Restart"></button><button id="close-ended" data-l10n="Close"></button></section>
</main>
<aside id="recent" aria-labelledby="recent-heading" hidden><div class="recent-heading"><h2 id="recent-heading" data-l10n="Recent Chats"></h2><button id="recent-close" type="button" data-l10n-aria="Close Recent Chats" aria-label="">×</button></div><div id="recent-list"></div></aside>
<script type="module" src="index.js"></script>
</body></html>
