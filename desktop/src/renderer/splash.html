<!-- The colours are declared twice on purpose, and the two survive different failures: the linked
     sheet is 'self' and survives a policy with no inline styles, the block below survives the sheet
     going missing from a build. Either one alone keeps the text readable on the dark window. -->
<style>html,body{background:#101216;color:#e6e9ef}h1{color:#fff}p{color:#b6bdc9}</style>
</head>
<body>
<h1>Starting Void Code</h1>
<p>The first start after installing is the slow one: the app unpacks itself and the system checks every unpacked file. It can take several minutes.</p>
<p class="quiet">Later starts are much quicker. This window closes by itself once the app is ready.</p>
</body></html>
