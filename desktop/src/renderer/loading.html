<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="loading.css"><title>Starting Void Code</title>
<!-- The colours are declared twice on purpose, and the two survive different failures: the linked
     sheet is 'self' and survives a policy with no inline styles, the block below survives the sheet
     going missing from a build. Either one alone keeps the text readable on the dark window. The
     spinner lives in the sheet only: without it the page loses its motion but not its words. -->
<style>html,body{background:#101216;color:#c9ced6}h1{color:#c9ced6}p{color:#848b95}</style>
</head>
<body>
<div class="spinner" role="img" aria-label="Starting"></div>
<h1>Void Code</h1>
<p class="status">First start takes minutes</p>
<p class="hint" data-role="close-cancels-startup">Close to cancel</p>
</body></html>
