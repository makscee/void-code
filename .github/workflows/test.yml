name: Test

on:
  push:
    branches-ignore:
      - 'main'
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: true
      # -tags vctestfixture selects cmd/vc/pi_web_search_install_vctest.go in
      # place of the production installer, so the suite stages a fixture instead
      # of shelling out to `npm ci`. Without it this step reaches the npm
      # registry, and has already gone red for a reason that was not ours
      # (npm error TypeError: terminated) while gating every push.
      #
      # What that costs, stated rather than hidden: with the tag set, the real
      # installation path runs in no test in this suite. Green here means
      # ownership, the settings key and the foreign-path guard hold -- it is not
      # evidence that the installation itself works. The tag reaches test
      # binaries only: every `go build` in this repository is untagged, so what
      # ships still carries the production installer.
      - name: Run tests
        run: go test -tags vctestfixture ./...
      - name: Validate release tag graphs
        run: ruby .github/scripts/check-release-tag-graphs.rb
      - name: Validate desktop CI gate and mutations
        run: ruby .github/scripts/test-desktop-ci-contract.rb

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: true
      # internal/harness/cmdline_windows_test.go and
      # internal/update/replace_windows_test.go were written, committed, and
      # then run nowhere. Every `go test` in this repository ran on
      # ubuntu-latest, where those files are not so much as compiled, and the
      # only thing that ever built GOOS=windows was the cross-build matrix in
      # release.yml. So a defect in Windows-only code -- a broken behaviour or
      # merely a compile error -- survived every branch and every pull request
      # and first appeared at the release it broke. This job is where it
      # appears instead, one push earlier and on a runner that can tell.
      #
      # ./... and not the two Windows packages: the failures worth catching sit
      # in code nobody marked Windows at all -- a test assuming a unix HOME, a
      # forward slash, a case-sensitive filesystem -- and hand-picking packages
      # is precisely how those stay hidden. -tags vctestfixture is parity, not
      # preference: the ubuntu job sets it, and two runners compiling different
      # code prove nothing about each other. It carries the same cost stated
      # above, unchanged by the platform -- the real installer runs in no test
      # here either.
      #
      # Red here is a finding, not an outage, and it is left free to redden the
      # run: continue-on-error would put these tests back where they already
      # were -- executed and unheeded. What it surfaces gets fixed under its own
      # spec, not quietly inside this one.
      - name: Run tests
        run: go test -tags vctestfixture ./...

  desktop-pinned-pi-smoke:
    name: Full desktop Vitest gate
    uses: ./.github/workflows/desktop-tests.yml

  # ---------------------------------------------------------------------------
  # Desktop packaging is described in exactly one place per platform, and both
  # callers reach it through `uses:`. Here, unconditionally: every branch push
  # and every pull request builds the app and the installer. In release.yml the
  # same two files are called behind the DESKTOP_RELEASE gate. That is what
  # makes a green run on a branch evidence about the release build -- the steps
  # are not similar, they are the same file. Two copies would be free to drift,
  # and the copy that drifts is always the one nobody runs.
  #
  # Both called workflows declare read-only permissions of their own, are
  # reachable only by `workflow_call`, and publish nothing: they leave a run
  # artifact and stop. Nothing about that is re-stated here, because re-stating
  # it here is the mistake this arrangement removes.
  # ---------------------------------------------------------------------------
  desktop-mac-app:
    name: Desktop macOS app artifact
    needs: desktop-pinned-pi-smoke
    uses: ./.github/workflows/desktop-mac-app.yml

  desktop-windows-app:
    name: Desktop Windows installer artifact
    needs: desktop-pinned-pi-smoke
    uses: ./.github/workflows/desktop-windows-app.yml
