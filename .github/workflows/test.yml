name: Test

on:
  push:
    branches-ignore:
      - 'main'
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Validate release tag graphs
        run: ruby .github/scripts/check-release-tag-graphs.rb

  desktop-pinned-pi-smoke:
    name: Desktop pinned Pi smoke
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/runtime/pi/package-lock.json
      - name: Provision exact desktop inputs
        working-directory: desktop
        run: |
          npm ci
          npm run build
          mkdir -p runtime/cache/node
          node_url=$(node -e "const p=require('./scripts/resource-pins.json'); process.stdout.write(p.node.source)")
          node_archive="runtime/cache/node/${node_url##*/}"
          curl --fail --location --proto '=https' --tlsv1.2 "$node_url" --output "$node_archive"
          want=$(node -e "const p=require('./scripts/resource-pins.json'); process.stdout.write(p.node.sourceArchiveSha256)")
          echo "$want  $node_archive" | shasum -a 256 -c -
          npm ci --prefix runtime/pi --ignore-scripts --no-audit --no-fund
          npm run assemble
      - name: Require exact pinned Pi smoke
        working-directory: desktop
        run: npm run check:pinned-pi-smoke
