name: Canary release

on:
  push:
    tags:
      - 'v*.*.*-vi20.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build signed vc-next Linux candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build separately named candidate
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X github.com/makscee/void-code/internal/version.Version=${{ github.ref_name }} -s -w" \
            -o vc-next-linux-amd64 ./cmd/vc
          sha256sum vc-next-linux-amd64 > SHA256SUMS.vi20
      - name: Sign build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            vc-next-linux-amd64
            SHA256SUMS.vi20
      - name: Publish non-current prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            vc-next-linux-amd64
            SHA256SUMS.vi20
