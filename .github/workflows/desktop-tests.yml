name: Desktop test gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Full desktop Vitest suite and pinned Pi qualification
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/runtime/pi/package-lock.json
      - name: Provision and require exact pinned Pi smoke
        run: desktop/scripts/provision-pinned-pi-smoke.sh
      - name: Run the complete desktop Vitest suite
        working-directory: desktop
        run: npm test
