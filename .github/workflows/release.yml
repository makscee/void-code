name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-vi20.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Validate auth-sync commit message
        run: ruby .github/scripts/check-release-auth-commit-message.rb

  desktop-tests:
    name: Full desktop Vitest gate
    uses: ./.github/workflows/desktop-tests.yml

  build:
    needs: [test, desktop-tests]
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            artifact: vc-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: vc-darwin-arm64
          - goos: linux
            goarch: amd64
            artifact: vc-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: vc-linux-arm64
          - goos: windows
            goarch: amd64
            artifact: vc-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: vc-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags "-X github.com/makscee/void-code/internal/version.Version=${{ github.ref_name }} -s -w" \
            -o ${{ matrix.artifact }} \
            ./cmd/vc

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  desktop-mac-app:
    name: Desktop macOS app
    needs: desktop-tests
    if: ${{ vars.DESKTOP_RELEASE == 'true' }}
    uses: ./.github/workflows/desktop-mac-app.yml

  desktop-windows-app:
    name: Desktop Windows installer
    needs: desktop-tests
    if: ${{ vars.DESKTOP_RELEASE == 'true' }}
    uses: ./.github/workflows/desktop-windows-app.yml

  release:
    name: Verify, stage, and publish the release
    needs: [build, desktop-mac-app, desktop-windows-app]
    if: ${{ !cancelled() && needs.build.result == 'success' && (vars.DESKTOP_RELEASE != 'true' || (needs.desktop-mac-app.result == 'success' && needs.desktop-windows-app.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'

      - name: Download every qualified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate metadata and exact expected manifest
        env:
          DESKTOP_RELEASE: ${{ vars.DESKTOP_RELEASE }}
        run: |
          VERSION="${{ github.ref_name }}"
          SEMVER="${VERSION#v}"
          cat > dist/version.json <<EOF
          {
            "version": "${SEMVER}",
            "tag": "${VERSION}",
            "artifacts": {
              "darwin/amd64": "vc-darwin-amd64",
              "darwin/arm64": "vc-darwin-arm64",
              "linux/amd64": "vc-linux-amd64",
              "linux/arm64": "vc-linux-arm64",
              "windows/amd64": "vc-windows-amd64.exe",
              "windows/arm64": "vc-windows-arm64.exe",
              "darwin-amd64": "vc-darwin-amd64",
              "darwin-arm64": "vc-darwin-arm64",
              "linux-amd64": "vc-linux-amd64",
              "linux-arm64": "vc-linux-arm64",
              "windows-amd64": "vc-windows-amd64.exe",
              "windows-arm64": "vc-windows-arm64.exe"
            },
            "files": {
              "darwin-amd64": "vc-darwin-amd64",
              "darwin-arm64": "vc-darwin-arm64",
              "linux-amd64": "vc-linux-amd64",
              "linux-arm64": "vc-linux-arm64",
              "windows-amd64": "vc-windows-amd64.exe",
              "windows-arm64": "vc-windows-arm64.exe"
            }
          }
          EOF
          cat > expected-assets.txt <<'EOF'
          SHA256SUMS
          vc-darwin-amd64
          vc-darwin-arm64
          vc-linux-amd64
          vc-linux-arm64
          vc-windows-amd64.exe
          vc-windows-arm64.exe
          version.json
          EOF
          EXPECTED_CLI_COUNT=8
          EXPECTED_DESKTOP_COUNT=11
          if [ "$DESKTOP_RELEASE" = true ]; then
            cat >> expected-assets.txt <<'EOF'
          Void-Code-0.1.0-windows-x64.exe
          void-code-mac-arm64.zip
          void-code-mac-x64.zip
          EOF
            expected_count=$EXPECTED_DESKTOP_COUNT
          else
            expected_count=$EXPECTED_CLI_COUNT
          fi
          sort -o expected-assets.txt expected-assets.txt
          [ "$(wc -l < expected-assets.txt)" -eq "$expected_count" ]
          chmod +x dist/vc-darwin-* dist/vc-linux-*
          (cd dist && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort) > SHA256SUMS)

      - name: Verify local names and checksums
        run: |
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > actual-assets.txt
          comm -3 expected-assets.txt actual-assets.txt | tee manifest-difference.txt
          test ! -s manifest-difference.txt
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Sign build provenance for every expected asset
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*

      - name: Create, upload, verify, and publish one owned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_DIST: dist
          RELEASE_EXPECTED_ASSETS: expected-assets.txt
          RELEASE_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: node desktop/scripts/release-publisher.mjs

  publish-auth:
    name: Sync release to void-auth
    needs: release
    runs-on: ubuntu-latest
    # Requires repo secret VOID_AUTH_PUSH_TOKEN — a fine-scoped PAT with
    # contents:write on makscee/void-auth.
    steps:
      - name: Checkout void-code
        uses: actions/checkout@v4

      - name: Checkout void-auth
        uses: actions/checkout@v4
        with:
          repository: makscee/void-auth
          token: ${{ secrets.VOID_AUTH_PUSH_TOKEN }}
          path: void-auth

      - name: Download release artifacts
        uses: robinraju/release-downloader@v1
        with:
          repository: makscee/void-code
          tag: ${{ github.ref_name }}
          fileName: "vc-*"
          out-file-path: void-auth/public/vc/bin

      - name: Generate version.json
        run: |
          VERSION="${{ github.ref_name }}"
          SEMVER="${VERSION#v}"
          # Artifact paths include bin/ prefix because binaries live at /vc/bin/<name>
          # and DefaultReleaseBaseURL = https://auth.makscee.ru/vc (VCD-33).
          cat > void-auth/public/vc/version.json <<EOF
          {
            "version": "${SEMVER}",
            "tag": "${VERSION}",
            "artifacts": {
              "darwin/amd64": "bin/vc-darwin-amd64",
              "darwin/arm64": "bin/vc-darwin-arm64",
              "linux/amd64": "bin/vc-linux-amd64",
              "linux/arm64": "bin/vc-linux-arm64",
              "windows/amd64": "bin/vc-windows-amd64.exe",
              "windows/arm64": "bin/vc-windows-arm64.exe",
              "darwin-amd64": "bin/vc-darwin-amd64",
              "darwin-arm64": "bin/vc-darwin-arm64",
              "linux-amd64": "bin/vc-linux-amd64",
              "linux-arm64": "bin/vc-linux-arm64",
              "windows-amd64": "bin/vc-windows-amd64.exe",
              "windows-arm64": "bin/vc-windows-arm64.exe"
            },
            "files": {
              "darwin-amd64": "bin/vc-darwin-amd64",
              "darwin-arm64": "bin/vc-darwin-arm64",
              "linux-amd64": "bin/vc-linux-amd64",
              "linux-arm64": "bin/vc-linux-arm64",
              "windows-amd64": "bin/vc-windows-amd64.exe",
              "windows-arm64": "bin/vc-windows-arm64.exe"
            }
          }
          EOF

      - name: Sync installers to canonical routes
        run: |
          cp install.sh void-auth/public/vc/install.sh
          cp install.ps1 void-auth/public/vc/install.ps1

      - name: Make Unix files executable
        run: |
          chmod +x void-auth/public/vc/bin/vc-darwin-* void-auth/public/vc/bin/vc-linux-*
          chmod +x void-auth/public/vc/install.sh

      - name: Commit and push to void-auth
        run: |
          cd void-auth
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/vc/bin/ public/vc/version.json public/vc/install.sh public/vc/install.ps1
          git diff --cached --quiet || git commit -m "chore: bump vc binaries to ${{ github.ref_name }}

          Automated sync from makscee/void-code release ${{ github.ref_name }}.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push
