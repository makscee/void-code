name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-vi20.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Validate auth-sync commit message
        run: ruby .github/scripts/check-release-auth-commit-message.rb

  desktop-pinned-pi-smoke:
    name: Desktop pinned Pi qualification
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/runtime/pi/package-lock.json
      - name: Provision and require exact pinned Pi smoke
        run: desktop/scripts/provision-pinned-pi-smoke.sh

  build:
    needs: [test, desktop-pinned-pi-smoke]
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            artifact: vc-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: vc-darwin-arm64
          - goos: linux
            goarch: amd64
            artifact: vc-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: vc-linux-arm64
          - goos: windows
            goarch: amd64
            artifact: vc-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: vc-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags "-X github.com/makscee/void-code/internal/version.Version=${{ github.ref_name }} -s -w" \
            -o ${{ matrix.artifact }} \
            ./cmd/vc

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate version.json
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' for semver field
          SEMVER="${VERSION#v}"
          cat > dist/version.json <<EOF
          {
            "version": "${SEMVER}",
            "tag": "${VERSION}",
            "artifacts": {
              "darwin/amd64": "vc-darwin-amd64",
              "darwin/arm64": "vc-darwin-arm64",
              "linux/amd64": "vc-linux-amd64",
              "linux/arm64": "vc-linux-arm64",
              "windows/amd64": "vc-windows-amd64.exe",
              "windows/arm64": "vc-windows-arm64.exe",
              "darwin-amd64": "vc-darwin-amd64",
              "darwin-arm64": "vc-darwin-arm64",
              "linux-amd64": "vc-linux-amd64",
              "linux-arm64": "vc-linux-arm64",
              "windows-amd64": "vc-windows-amd64.exe",
              "windows-arm64": "vc-windows-arm64.exe"
            },
            "files": {
              "darwin-amd64": "vc-darwin-amd64",
              "darwin-arm64": "vc-darwin-arm64",
              "linux-amd64": "vc-linux-amd64",
              "linux-arm64": "vc-linux-arm64",
              "windows-amd64": "vc-windows-amd64.exe",
              "windows-arm64": "vc-windows-arm64.exe"
            }
          }
          EOF

      - name: Make Unix binaries executable
        run: chmod +x dist/vc-darwin-* dist/vc-linux-*

      - name: Generate checksums
        working-directory: dist
        run: sha256sum vc-* version.json > SHA256SUMS

      - name: Sign build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/vc-darwin-amd64
            dist/vc-darwin-arm64
            dist/vc-linux-amd64
            dist/vc-linux-arm64
            dist/vc-windows-amd64.exe
            dist/vc-windows-arm64.exe
            dist/version.json
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vc-darwin-amd64
            dist/vc-darwin-arm64
            dist/vc-linux-amd64
            dist/vc-linux-arm64
            dist/vc-windows-amd64.exe
            dist/vc-windows-arm64.exe
            dist/version.json
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-auth:
    name: Sync binaries to void-auth
    needs: release
    runs-on: ubuntu-latest
    # Requires repo secret VOID_AUTH_PUSH_TOKEN — a fine-scoped PAT with
    # contents:write on makscee/void-auth.
    steps:
      - name: Checkout void-auth
        uses: actions/checkout@v4
        with:
          repository: makscee/void-auth
          token: ${{ secrets.VOID_AUTH_PUSH_TOKEN }}
          path: void-auth

      - name: Download release artifacts
        uses: robinraju/release-downloader@v1
        with:
          repository: makscee/void-code
          tag: ${{ github.ref_name }}
          fileName: "vc-*"
          out-file-path: void-auth/public/vc/bin

      - name: Generate version.json
        run: |
          VERSION="${{ github.ref_name }}"
          SEMVER="${VERSION#v}"
          # Artifact paths include bin/ prefix because binaries live at /vc/bin/<name>
          # and DefaultReleaseBaseURL = https://auth.makscee.ru/vc (VCD-33).
          cat > void-auth/public/vc/version.json <<EOF
          {
            "version": "${SEMVER}",
            "tag": "${VERSION}",
            "artifacts": {
              "darwin/amd64": "bin/vc-darwin-amd64",
              "darwin/arm64": "bin/vc-darwin-arm64",
              "linux/amd64": "bin/vc-linux-amd64",
              "linux/arm64": "bin/vc-linux-arm64",
              "windows/amd64": "bin/vc-windows-amd64.exe",
              "windows/arm64": "bin/vc-windows-arm64.exe",
              "darwin-amd64": "bin/vc-darwin-amd64",
              "darwin-arm64": "bin/vc-darwin-arm64",
              "linux-amd64": "bin/vc-linux-amd64",
              "linux-arm64": "bin/vc-linux-arm64",
              "windows-amd64": "bin/vc-windows-amd64.exe",
              "windows-arm64": "bin/vc-windows-arm64.exe"
            },
            "files": {
              "darwin-amd64": "bin/vc-darwin-amd64",
              "darwin-arm64": "bin/vc-darwin-arm64",
              "linux-amd64": "bin/vc-linux-amd64",
              "linux-arm64": "bin/vc-linux-arm64",
              "windows-amd64": "bin/vc-windows-amd64.exe",
              "windows-arm64": "bin/vc-windows-arm64.exe"
            }
          }
          EOF

      - name: Make Unix binaries executable
        run: chmod +x void-auth/public/vc/bin/vc-darwin-* void-auth/public/vc/bin/vc-linux-*

      - name: Commit and push to void-auth
        run: |
          cd void-auth
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/vc/bin/ public/vc/version.json
          git diff --cached --quiet || git commit -m "chore: bump vc binaries to ${{ github.ref_name }}

          Automated sync from makscee/void-code release ${{ github.ref_name }}.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push
