name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            artifact: vc-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: vc-darwin-arm64
          - goos: linux
            goarch: amd64
            artifact: vc-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: vc-linux-arm64
          - goos: windows
            goarch: amd64
            artifact: vc-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: vc-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags "-X github.com/makscee/void-code/internal/version.Version=${{ github.ref_name }} -s -w" \
            -o ${{ matrix.artifact }} \
            ./cmd/vc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate version.json
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' for semver field
          SEMVER="${VERSION#v}"
          cat > dist/version.json <<EOF
          {
            "version": "${SEMVER}",
            "tag": "${VERSION}",
            "artifacts": {
              "darwin/amd64": "vc-darwin-amd64",
              "darwin/arm64": "vc-darwin-arm64",
              "linux/amd64": "vc-linux-amd64",
              "linux/arm64": "vc-linux-arm64",
              "windows/amd64": "vc-windows-amd64.exe",
              "windows/arm64": "vc-windows-arm64.exe"
            }
          }
          EOF

      - name: Make Unix binaries executable
        run: chmod +x dist/vc-darwin-* dist/vc-linux-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vc-darwin-amd64
            dist/vc-darwin-arm64
            dist/vc-linux-amd64
            dist/vc-linux-arm64
            dist/vc-windows-amd64.exe
            dist/vc-windows-arm64.exe
            dist/version.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Run tests
        run: go test ./...
