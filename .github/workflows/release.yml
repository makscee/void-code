name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-vi20.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
      # -tags vctestfixture selects cmd/vc/pi_web_search_install_vctest.go in
      # place of the production installer, so the suite stages a fixture instead
      # of shelling out to `npm ci`. Without it this step reaches the npm
      # registry, and has already gone red for a reason that was not ours
      # (npm error TypeError: terminated) while gating every push.
      #
      # What that costs, stated rather than hidden: with the tag set, the real
      # installation path runs in no test in this suite. Green here means
      # ownership, the settings key and the foreign-path guard hold -- it is not
      # evidence that the installation itself works. The tag reaches test
      # binaries only: every `go build` in this repository is untagged, so what
      # ships still carries the production installer.
      - name: Run tests
        run: go test -tags vctestfixture ./...
      - name: Validate auth-sync commit message
        run: ruby .github/scripts/check-release-auth-commit-message.rb

  # The Windows Go suite gated pull requests and gated nothing that publishes.
  # This workflow ran one `go test`, on ubuntu-latest, and the chain
  # test + desktop-pinned-pi-smoke -> build -> release -> publish-auth never
  # mentioned Windows: internal/harness/cmdline_windows_test.go and
  # internal/update/replace_windows_test.go are not so much as compiled there,
  # and the only thing here that ever built GOOS=windows was the cross-build
  # matrix below, which compiles the product and runs none of its tests. So a
  # Windows-only defect could go red on the pull request and be merged anyway,
  # or arrive by a path that had no pull request at all, and ship in
  # vc-windows-amd64.exe and in the installer built around it with every gate on
  # the release run green.
  #
  # This call is that gate, and it is deliberately the same file test.yml calls
  # on every branch push -- not a job of the same shape written out here. A copy
  # in a tag-triggered workflow is a description no branch push can reach: free
  # to drift, and the copy that drifts is the one nobody runs, so a green branch
  # run would say nothing about what qualifies the release. Everything the gate
  # owes -- the whole module, the fixture build tag, actions pinned by commit
  # SHA, no continue-on-error and no `if:` -- is written once, in that file.
  # What is owed here is the call itself: unconditional, and named in
  # `build.needs` so publication cannot outrun it.
  test-windows:
    name: Test (Windows)
    uses: ./.github/workflows/windows-go-tests.yml

  desktop-pinned-pi-smoke:
    name: Full desktop Vitest gate
    uses: ./.github/workflows/desktop-tests.yml

  build:
    needs: [test, test-windows, desktop-pinned-pi-smoke]
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            artifact: vc-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: vc-darwin-arm64
          - goos: linux
            goarch: amd64
            artifact: vc-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: vc-linux-arm64
          - goos: windows
            goarch: amd64
            artifact: vc-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: vc-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags "-X github.com/makscee/void-code/internal/version.Version=${{ github.ref_name }} -s -w" \
            -o ${{ matrix.artifact }} \
            ./cmd/vc

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate version.json
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' for semver field
          SEMVER="${VERSION#v}"
          cat > dist/version.json <<EOF
          {
            "version": "${SEMVER}",
            "tag": "${VERSION}",
            "artifacts": {
              "darwin/amd64": "vc-darwin-amd64",
              "darwin/arm64": "vc-darwin-arm64",
              "linux/amd64": "vc-linux-amd64",
              "linux/arm64": "vc-linux-arm64",
              "windows/amd64": "vc-windows-amd64.exe",
              "windows/arm64": "vc-windows-arm64.exe",
              "darwin-amd64": "vc-darwin-amd64",
              "darwin-arm64": "vc-darwin-arm64",
              "linux-amd64": "vc-linux-amd64",
              "linux-arm64": "vc-linux-arm64",
              "windows-amd64": "vc-windows-amd64.exe",
              "windows-arm64": "vc-windows-arm64.exe"
            },
            "files": {
              "darwin-amd64": "vc-darwin-amd64",
              "darwin-arm64": "vc-darwin-arm64",
              "linux-amd64": "vc-linux-amd64",
              "linux-arm64": "vc-linux-arm64",
              "windows-amd64": "vc-windows-amd64.exe",
              "windows-arm64": "vc-windows-arm64.exe"
            }
          }
          EOF

      - name: Make Unix binaries executable
        run: chmod +x dist/vc-darwin-* dist/vc-linux-*

      - name: Generate checksums
        working-directory: dist
        run: sha256sum vc-* version.json > SHA256SUMS

      - name: Sign build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/vc-darwin-amd64
            dist/vc-darwin-arm64
            dist/vc-linux-amd64
            dist/vc-linux-arm64
            dist/vc-windows-amd64.exe
            dist/vc-windows-arm64.exe
            dist/version.json
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vc-darwin-amd64
            dist/vc-darwin-arm64
            dist/vc-linux-amd64
            dist/vc-linux-arm64
            dist/vc-windows-amd64.exe
            dist/vc-windows-arm64.exe
            dist/version.json
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ---------------------------------------------------------------------------
  # The desktop half, and the one thing that has to stay true about it: with
  # nothing set, none of this runs and none of it publishes. An ordinary tag
  # produces exactly the jobs and exactly the assets it produced before these
  # three jobs existed.
  #
  # The switch is the repository variable DESKTOP_RELEASE. Unset -- which is
  # what merging this leaves -- every condition below is false, all three jobs
  # are skipped, and no job the CLI release depends on waits on them: `build`
  # needs Go tests and the full desktop qualification, `release` needs build, and
  # `publish-auth` -- self-update for every installed client -- needs release.
  # None of those four names appears in a `needs:` here. The dependency runs the
  # other way, so a desktop build that dies on a runner cannot withhold the CLI
  # or the self-update.
  #
  # Publication is the last job only, it attaches to the release that already
  # exists, and it is gated by the same variable.
  # ---------------------------------------------------------------------------
  desktop-mac-app:
    name: Desktop macOS app
    needs: desktop-pinned-pi-smoke
    if: ${{ vars.DESKTOP_RELEASE == 'true' }}
    uses: ./.github/workflows/desktop-mac-app.yml

  desktop-windows-app:
    name: Desktop Windows installer
    needs: desktop-pinned-pi-smoke
    if: ${{ vars.DESKTOP_RELEASE == 'true' }}
    uses: ./.github/workflows/desktop-windows-app.yml

  desktop-attach:
    name: Attach the desktop builds to the release
    needs: [release, desktop-mac-app, desktop-windows-app]
    if: ${{ vars.DESKTOP_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download every desktop build this run produced
        # By pattern, never by name. Which builds exist is stated once -- the
        # matrix in desktop-mac-app.yml, the upload step in
        # desktop-windows-app.yml -- and this job asks for whatever that came to
        # rather than keeping a second copy of the answer. The second copy is
        # what the Intel row walked into: the matrix grew a row, the list here
        # did not, and nothing went red -- the bundle was built for twenty
        # minutes of runner time, uploaded as a run artifact nobody can reach,
        # and left out of the release.
        #
        # `void-code-*` is the prefix every desktop upload already carries and no
        # CLI artifact does -- those are `vc-*`, uploaded by the `build` matrix
        # above and published by `release` -- so this reaches the desktop builds
        # and only them. A new architecture arrives here on its own; a removed
        # one leaves nothing behind pointing at it.
        #
        # merge-multiple is not decoration. Downloaded by pattern without it,
        # each artifact lands in a directory named after itself and the glob
        # below would match those directories instead of the files in them.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: void-code-*
          merge-multiple: true
          path: desktop-installers

      - name: Sign build provenance for the desktop builds
        # The same glob the attach step uses, over a directory holding nothing
        # but what the download brought back, so what is signed and what is
        # published cannot come apart. Signing a subset would be worse than
        # signing none: the release would then carry attestations that look
        # complete. The action fails when the path matches nothing, which is
        # where a download that found no artifact stops -- before the release
        # gains anything.
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: desktop-installers/*

      - name: Attach them to the release that already exists
        # `upload`, never `create`: the release was made by the `release` job on
        # its own terms, and this adds the desktop builds to it. There is no
        # checkout in this job, so gh is told the repository through the
        # environment. A directory of its own, not the `dist` the `release` job
        # stages the CLI in: this glob must not be able to reach a CLI asset,
        # and a name saying what it holds is how a reader can tell that it
        # cannot.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload ${{ github.ref_name }} desktop-installers/* --clobber

  publish-auth:
    name: Sync release to void-auth
    needs: release
    runs-on: ubuntu-latest
    # Requires repo secret VOID_AUTH_PUSH_TOKEN — a fine-scoped PAT with
    # contents:write on makscee/void-auth.
    steps:
      - name: Checkout void-code
        uses: actions/checkout@v4

      - name: Checkout void-auth
        uses: actions/checkout@v4
        with:
          repository: makscee/void-auth
          token: ${{ secrets.VOID_AUTH_PUSH_TOKEN }}
          path: void-auth

      - name: Download release artifacts
        uses: robinraju/release-downloader@v1
        with:
          repository: makscee/void-code
          tag: ${{ github.ref_name }}
          fileName: "vc-*"
          out-file-path: void-auth/public/vc/bin

      # The checksum list install.sh checks the PRIMARY download against. It has
      # been attached to the release since long before this step existed, and it
      # never reached the served copy: the step above copies binaries only, so
      # $AUTH_HOST/vc/SHA256SUMS was a 404 and the front-door download was the
      # one thing nothing checked.
      #
      # Its own step rather than a widened `vc-*` glob, and out-file-path
      # public/vc rather than public/vc/bin: install.sh looks for it beside
      # version.json, and a list published under bin/ is a file nobody reads.
      - name: Download release checksums
        uses: robinraju/release-downloader@v1
        with:
          repository: makscee/void-code
          tag: ${{ github.ref_name }}
          fileName: "SHA256SUMS"
          out-file-path: void-auth/public/vc

      - name: Generate version.json
        run: |
          VERSION="${{ github.ref_name }}"
          SEMVER="${VERSION#v}"
          # Artifact paths include bin/ prefix because binaries live at /vc/bin/<name>
          # and DefaultReleaseBaseURL = https://auth.makscee.ru/vc (VCD-33).
          cat > void-auth/public/vc/version.json <<EOF
          {
            "version": "${SEMVER}",
            "tag": "${VERSION}",
            "artifacts": {
              "darwin/amd64": "bin/vc-darwin-amd64",
              "darwin/arm64": "bin/vc-darwin-arm64",
              "linux/amd64": "bin/vc-linux-amd64",
              "linux/arm64": "bin/vc-linux-arm64",
              "windows/amd64": "bin/vc-windows-amd64.exe",
              "windows/arm64": "bin/vc-windows-arm64.exe",
              "darwin-amd64": "bin/vc-darwin-amd64",
              "darwin-arm64": "bin/vc-darwin-arm64",
              "linux-amd64": "bin/vc-linux-amd64",
              "linux-arm64": "bin/vc-linux-arm64",
              "windows-amd64": "bin/vc-windows-amd64.exe",
              "windows-arm64": "bin/vc-windows-arm64.exe"
            },
            "files": {
              "darwin-amd64": "bin/vc-darwin-amd64",
              "darwin-arm64": "bin/vc-darwin-arm64",
              "linux-amd64": "bin/vc-linux-amd64",
              "linux-arm64": "bin/vc-linux-arm64",
              "windows-amd64": "bin/vc-windows-amd64.exe",
              "windows-arm64": "bin/vc-windows-arm64.exe"
            }
          }
          EOF

      - name: Sync installers to canonical routes
        run: |
          cp install.sh void-auth/public/vc/install.sh
          cp install.ps1 void-auth/public/vc/install.ps1

      - name: Make Unix files executable
        run: |
          chmod +x void-auth/public/vc/bin/vc-darwin-* void-auth/public/vc/bin/vc-linux-*
          chmod +x void-auth/public/vc/install.sh

      - name: Commit and push to void-auth
        run: |
          cd void-auth
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # SHA256SUMS is staged with the rest: void-auth serves what is
          # committed, so a list downloaded into the checkout and left unstaged
          # reaches nobody and install.sh keeps printing "not verified".
          git add public/vc/bin/ public/vc/version.json public/vc/install.sh public/vc/install.ps1 public/vc/SHA256SUMS
          git diff --cached --quiet || git commit -m "chore: bump vc binaries to ${{ github.ref_name }}

          Automated sync from makscee/void-code release ${{ github.ref_name }}.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push
