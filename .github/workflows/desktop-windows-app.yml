name: Desktop Windows installer build

# The only description of Windows packaging there is. It is reachable only
# through `uses:` -- from test.yml on every branch push, and from release.yml
# behind the job condition that decides whether a release builds the desktop
# installer at all; it cannot be started by an event of its own. Both callers
# reaching the same file is the point: the steps CI exercises on a branch are,
# byte for byte, the steps a release builds with. It builds and leaves a run
# artifact. Nothing here creates a release, writes a tag or publishes: the
# single step that attaches anything to a release lives in release.yml, behind
# the same switch, and the token here is read-only so the refusal is the
# platform's and not merely ours. An installer is the most publishable thing
# this repository builds, so that matters more here than anywhere else.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Package the Windows installer
    runs-on: windows-latest
    defaults:
      run:
        # A Windows runner runs steps in PowerShell by default, and PowerShell
        # does not stop at the first failing external command: GitHub appends
        # only `exit $LASTEXITCODE`, so a step of several commands reports the
        # exit code of its LAST one and swallows every failure before it. A
        # download that failed would go green here and the packaging step would
        # then die on a digest mismatch. bash is run as
        # `bash --noprofile --norc -eo pipefail`, which stops at the first
        # failure, so every multi-command step below is declared to it.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/runtime/pi/package-lock.json
      - name: Install the desktop dependencies from the lockfile
        working-directory: desktop
        run: npm ci
      - name: Fetch the pinned Windows Node runtime, verifying its digest
        working-directory: desktop
        run: |
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { mkdir, readFile, writeFile } from "node:fs/promises";
            import path from "node:path";

            const pin = JSON.parse(await readFile("scripts/resource-pins.json", "utf8")).windows.node;
            const response = await fetch(pin.source, { redirect: "follow" });
            if (!response.ok) throw new Error(`${pin.source} answered ${response.status} ${response.statusText}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            const digest = createHash("sha256").update(bytes).digest("hex");
            if (digest !== pin.sourceArchiveSha256) throw new Error(`${pin.source} produced ${digest}, the pin expects ${pin.sourceArchiveSha256}`);
            const into = path.join("runtime/cache/node", path.basename(pin.source));
            await mkdir(path.dirname(into), { recursive: true });
            await writeFile(into, bytes);
            console.log(`verified ${into} against the pin`);
          '
      - name: Package the Windows installer
        working-directory: desktop
        env:
          VOID_DESKTOP_VC_SOURCE_COMMIT: ${{ github.sha }}
          VOID_DESKTOP_VC_VERSION: ${{ github.ref_name }}
        # Through the npm script, never electron-builder by hand: package:win is
        # build, then scripts/assemble-windows-resources.mjs, then
        # electron-builder --win --x64. Calling the builder directly would skip
        # the assembly, and the assembly is what stages the private runtime the
        # app cannot start without.
        run: npm run package:win
      - name: Upload the Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # The name is the packager's, assembled from desktop/package.json:
        # directories.output, win.target (nsis -> .exe), version, the --x64 of
        # package:win, and build.nsis.artifactName. It is never retyped:
        # windows-app-artifact-workflow.test.ts derives it from that config and
        # compares it against this line, so a renamed product, a changed target
        # or a different arch is a red test rather than an empty download. Only
        # the version is globbed, so a version bump does not turn into a job
        # that uploads nothing, and `if-no-files-found: error` turns a glob that
        # matched nothing into a failed job rather than an empty artifact.
        with:
          name: void-code-windows-x64-installer
          path: desktop/release/Void-Code-*-windows-x64.exe
          if-no-files-found: error
